<svg width="100%" viewBox="0 0 860 200" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>DataDallion Framework</title>
  <desc>DataDallion Framework — Metadata-driven Medallion Architecture for Data Pipelines</desc>

  <style>
    .bg   { fill: #0f1419; }
    .bg2  { fill: #1a2332; }
    .sep  { stroke: #2d3f55; stroke-width: 0.5; }
    .wm   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 30px; font-weight: 600; fill: #f0f6fc; }
    .tag  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; font-weight: 400; fill: #8b949e; }
    .lbl  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; font-weight: 600; }
    .dot  { }
    .pill { rx: 4; }
    @media (prefers-color-scheme: light) {
      .bg  { fill: #ffffff; }
      .bg2 { fill: #f6f8fa; }
      .sep { stroke: #d0d7de; }
      .wm  { fill: #1f2328; }
      .tag { fill: #57606a; }
    }
  </style>

  <rect width="860" height="200" class="bg"/>

  <rect x="0" y="0" width="860" height="200" rx="0" fill="none"/>

  <rect x="20" y="20" width="820" height="160" rx="10" class="bg2" fill-opacity="0.5"/>

  <rect x="55" y="52" width="76" height="26" rx="5" fill="#c89b3c" stroke="#a07828" stroke-width="0.5"/>
  <text x="93" y="70" text-anchor="middle" class="lbl" fill="#3d2800" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="700">Gold</text>

  <polygon points="88,82 98,82 93,76" fill="#6e7681"/>

  <rect x="44" y="84" width="98" height="26" rx="5" fill="#8b949e" stroke="#6e7681" stroke-width="0.5"/>
  <text x="93" y="102" text-anchor="middle" class="lbl" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="700">Silver</text>

  <polygon points="88,114 98,114 93,108" fill="#6e7681"/>

  <rect x="33" y="116" width="120" height="26" rx="5" fill="#b36a2e" stroke="#8f4e1c" stroke-width="0.5"/>
  <text x="93" y="134" text-anchor="middle" class="lbl" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="700">Bronze</text>

  <line x1="178" y1="30" x2="178" y2="170" class="sep"/>

  <text x="200" y="88" class="wm">DataDallion Framework</text>
  <text x="200" y="112" class="tag">Metadata-driven Medallion Architecture · Data Pipelines</text>

  <line x1="200" y1="126" x2="820" y2="126" class="sep"/>

  <circle cx="208" cy="144" r="4" fill="#b36a2e"/>
  <text x="218" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#8b949e">Bronze</text>

  <text x="268" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#4d5562">·</text>

  <circle cx="280" cy="144" r="4" fill="#8b949e"/>
  <text x="290" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#8b949e">Silver</text>

  <text x="334" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#4d5562">·</text>

  <circle cx="346" cy="144" r="4" fill="#c89b3c"/>
  <text x="356" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#8b949e">Gold</text>

  <text x="390" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#4d5562">·</text>
  <text x="402" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#8b949e">PySpark  ·  Delta Lake  ·  SQLModel  ·  Apache 2.0</text>
</svg>
